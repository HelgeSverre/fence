name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Build Vite
        run: bunx vite build

      - name: Build Electron (publish on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bunx electron-builder --mac --publish always

      - name: Build Electron (artifact only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bunx electron-builder --mac

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: fence-mac
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: ignore

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Build Vite
        run: bunx vite build

      - name: Build Electron (publish on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx electron-builder --linux --publish always

      - name: Build Electron (artifact only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: bunx electron-builder --linux

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: fence-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Build Vite
        run: bunx vite build

      - name: Build Electron (publish on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx electron-builder --win --publish always

      - name: Build Electron (artifact only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: bunx electron-builder --win

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: fence-win
          path: |
            release/*.exe
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-linux, build-win]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false

  publish-homebrew:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download macOS DMGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "*.dmg" --dir dist

      - name: Publish Homebrew cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha_arm64="$(shasum -a 256 "dist/Fence-${version}-arm64.dmg" | awk '{print $1}')"
          sha_x64="$(shasum -a 256 "dist/Fence-${version}.dmg" | awk '{print $1}')"
          tmp="$(mktemp -d)"
          git clone --quiet --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/HelgeSverre/homebrew-tap.git" \
            "$tmp/tap"
          mkdir -p "$tmp/tap/Casks"
          bash scripts/render-cask.sh "$version" "$sha_arm64" "$sha_x64" > "$tmp/tap/Casks/fence.rb"
          cd "$tmp/tap"
          git add Casks/fence.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date for v${version}"
            exit 0
          fi
          git -c user.name="fence-release-bot" \
              -c user.email="fence-release-bot@users.noreply.github.com" \
              commit -m "fence ${version}"
          git push --quiet origin main
