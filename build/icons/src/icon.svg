<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4478"/>
      <stop offset="1" stop-color="#171c38"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="picket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe3f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
  </defs>
  <!-- macOS squircle with the standard ~10% transparent margin -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <!-- rails behind the pickets -->
    <rect x="180" y="470" width="664" height="56" rx="8" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="180" y="640" width="664" height="56" rx="8" fill="#ffffff" fill-opacity="0.22"/>
    <!-- three pickets -->
    <g fill="url(#picket)" filter="url(#shadow)">
      <path d="M306 250 L370 348 L370 790 L242 790 L242 348 Z"/>
      <path d="M512 250 L576 348 L576 790 L448 790 L448 348 Z"/>
      <path d="M718 250 L782 348 L782 790 L654 790 L654 348 Z"/>
    </g>
  </g>
</svg>
