<!doctype html>
<html lang="en" data-theme="catppuccin-mocha">
  <head>
    <meta charset="utf-8" />
    <title>Fence — Split-view Markdown Editor</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Fence is a split-view Markdown editor for macOS, Windows, and Linux. Built with Elm and Electron."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fence" />
    <meta property="og:title" content="Fence — Split-view Markdown Editor" />
    <meta
      property="og:description"
      content="A focused Markdown editor with live preview, frontmatter support, and a library of themes."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#1e1e2e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var t = localStorage.getItem('fence-site-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
